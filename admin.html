<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin LocateUMN</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css">
  <link rel="stylesheet" href="admin/admin.css">
</head>
<body>
  <div class="container" style="max-width: 700px;">
    <header class="header">
      <img src="assets/logo.png" alt="Logo" class="logo" style="width:60px; height:60px;">
      <h1 class="title" style="font-size:1.8rem;">Admin Panel</h1>
    </header>

    <div class="card" id="locations-container">
      <h3>📍 Daftar Lokasi</h3>
      <div id="locations-list"></div>
      <button class="btn btn-primary btn-small" id="btn-add-location">+ Tambah Lokasi</button>
    </div>

    <!-- MAP CONTAINER -->
    <div class="card" style="padding: 0; overflow: hidden; border-radius: var(--radius);">
      <div id="map" style="height: 500px; width: 100%;"></div>
    </div>

    <!-- DRAWING TOOLS CARD -->
    <div class="card" id="draw-tools">
      <h3>✏️ Draw Polygon</h3>
      <div class="flex-row" style="gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-small" id="btn-draw-start">🖊️ Mulai Drawing</button>
        <button class="btn btn-small btn-primary" id="btn-draw-save" disabled>💾 Simpan Polygon</button>
        <button class="btn btn-small" id="btn-draw-cancel" disabled>❌ Batalkan</button>
        <button class="btn btn-small btn-danger" id="btn-draw-clear" disabled>🗑️ Hapus Drawing</button>
      </div>
      <small style="color: #aaa;">Klik pada peta untuk membuat titik, double-click untuk menutup polygon.</small>
    </div>

    <div class="card" style="flex-direction: row; flex-wrap: wrap; gap: 12px;">
      <button class="btn btn-small" id="btn-export">📤 Export JSON</button>
      <button class="btn btn-small" id="btn-import">📥 Import JSON</button>
      <input type="file" id="import-file" accept=".json" style="display:none;">
      <button class="btn btn-small btn-danger" id="btn-logout">🚪 Logout</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet Draw JS -->
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
  <script src="admin/admin.js"></script>
  <script src="admin/map.js"></script>
  <script src="admin/draw.js"></script>
</body>
</html>
